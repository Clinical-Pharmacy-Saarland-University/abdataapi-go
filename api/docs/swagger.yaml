definitions:
  ChangeEmailQuery:
    properties:
      email:
        description: New email address
        example: newmail@newcomp.com
        type: string
    required:
    - email
    type: object
  ChangePwdQuery:
    properties:
      new_password:
        description: New password
        example: new_password
        type: string
      old_password:
        description: Old password
        example: old_password
        type: string
    required:
    - new_password
    - old_password
    type: object
  CompoundBatchResult:
    properties:
      id:
        description: ID of the query
        example: "1"
        type: string
      interactions:
        description: Drug-drug interactions
        items:
          $ref: '#/definitions/CompoundInteraction'
        type: array
      message:
        description: Status message (e.g. error message)
        example: Success
        type: string
      status:
        description: HTTP status code of the query
        example: 200
        type: integer
    type: object
  CompoundDose:
    properties:
      active_substance:
        example: true
        type: boolean
      dosage_form:
        example: TAB
        type: string
      suffix:
        example: (retard)
        type: string
      unit:
        example: mg
        type: string
      value:
        example: 500
        type: number
    type: object
  CompoundInteraction:
    properties:
      compounds_left:
        description: Victim compound(s)
        example:
        - Aspirin
        items:
          type: string
        type: array
      compounds_right:
        description: Perpetrator compound(s)
        example:
        - Paracetamol
        items:
          type: string
        type: array
      credibility:
        description: Credibility of the interaction
        example: insufficient
        type: string
      direction:
        description: Direction of the interaction
        example: undirected interaction
        type: string
      doses_left:
        description: Doses of the victim compounds
        items:
          $ref: '#/definitions/CompoundDose'
        type: array
      doses_right:
        description: Doses of the perpetrator compounds
        items:
          $ref: '#/definitions/CompoundDose'
        type: array
      frequency:
        description: Frequency of the interaction
        example: common
        type: string
      plausibility:
        description: Plausibility of the interaction
        example: plausible mechanism
        type: string
      relevance:
        description: Relevance of the interaction
        example: minor
        type: string
      text:
        allOf:
        - $ref: '#/definitions/InteractionText'
        description: Extracted interaction text
    type: object
  CompoundInteractionPostQuery:
    properties:
      compounds:
        description: Array of compounds
        example:
        - Aspirin
        - Paracetamol
        items:
          type: string
        type: array
      details:
        description: Detailed interaction descriptions
        example: true
        type: boolean
      doses:
        description: Fetch dose/formulation information
        example: true
        type: boolean
      id:
        description: ID of the query
        example: "1"
        type: string
      text:
        description: Fetch interaction text
        example: true
        type: boolean
    required:
    - compounds
    - id
    type: object
  ConfirmEmailChangeQuery:
    properties:
      token:
        description: Change token
        example: my_change_token
        type: string
    required:
    - token
    type: object
  CreateServiceUserQuery:
    properties:
      email:
        example: joe@gmail.com
        maxLength: 255
        minLength: 2
        type: string
      first_name:
        example: Joe
        maxLength: 255
        minLength: 2
        type: string
      last_name:
        example: Doe
        maxLength: 255
        minLength: 2
        type: string
      organization:
        example: ACME
        maxLength: 255
        minLength: 2
        type: string
      password:
        example: password123
        type: string
      role:
        enum:
        - admin
        - user
        - approver
        type: string
    required:
    - email
    - first_name
    - last_name
    - organization
    - password
    - role
    type: object
  CreateUserQuery:
    properties:
      email:
        example: joe@gmail.com
        maxLength: 255
        minLength: 2
        type: string
      first_name:
        example: Joe
        maxLength: 255
        minLength: 2
        type: string
      last_name:
        example: Doe
        maxLength: 255
        minLength: 2
        type: string
      organization:
        example: ACME
        maxLength: 255
        minLength: 2
        type: string
      role:
        enum:
        - admin
        - user
        - approver
        type: string
    required:
    - email
    - first_name
    - last_name
    - organization
    - role
    type: object
  ErrorResponse:
    properties:
      error:
        description: Error message
        example: Some error message
        type: string
    type: object
  FormResponse:
    properties:
      formulations:
        description: Formulations
        items:
          $ref: '#/definitions/Formulation'
        type: array
    type: object
  Formulation:
    properties:
      description:
        description: Formulation description
        example: Tablet
        type: string
      formulation:
        description: Formulation code
        example: TAB
        type: string
    type: object
  InfoResp:
    properties:
      api_limits:
        allOf:
        - $ref: '#/definitions/cfg.LimitsConfig'
        description: Limits
      meta_info:
        allOf:
        - $ref: '#/definitions/cfg.MetaConfig'
        description: Meta
    type: object
  InteractionText:
    properties:
      data_basis:
        type: string
      literature:
        type: string
      mechanism:
        type: string
      pharmacologic_effect:
        type: string
    type: object
  JSendError:
    properties:
      message:
        description: Error message
        example: Internal server error
        type: string
      status:
        description: Status
        example: error
        type: string
    type: object
  JSendFailure-ErrorResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/ErrorResponse'
        description: Data with error message(s)
      status:
        description: Status 'fail'
        example: fail
        type: string
    type: object
  JSendFailure-ValidationResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/ValidationResponse'
        description: Data with error message(s)
      status:
        description: Status 'fail'
        example: fail
        type: string
    type: object
  JSendSuccess-FormResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/FormResponse'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-InfoResp:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/InfoResp'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-LoginResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/LoginResponse'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-PingResp:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/PingResp'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-UserProfile:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/UserProfile'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-array_CompoundBatchResult:
    properties:
      data:
        description: Data with success message(s)
        items:
          $ref: '#/definitions/CompoundBatchResult'
        type: array
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-array_CompoundInteraction:
    properties:
      data:
        description: Data with success message(s)
        items:
          $ref: '#/definitions/CompoundInteraction'
        type: array
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-array_PZNBatchResult:
    properties:
      data:
        description: Data with success message(s)
        items:
          $ref: '#/definitions/PZNBatchResult'
        type: array
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-array_PZNInteraction:
    properties:
      data:
        description: Data with success message(s)
        items:
          $ref: '#/definitions/PZNInteraction'
        type: array
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  JSendSuccess-map_string_string:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/map_string_string'
        description: Data with success message(s)
      status:
        description: Status 'success'
        example: success
        type: string
    type: object
  LoginQuery:
    properties:
      login:
        example: joe@me.com
        type: string
      password:
        example: password
        type: string
      role:
        enum:
        - admin
        - user
        - approver
        example: user
        type: string
    required:
    - login
    - password
    type: object
  LoginResponse:
    properties:
      access_expires_in:
        description: Access token expiration time
        example: "2021-07-01T12:00:00Z"
        type: string
      access_token:
        description: Access token
        example: your_access_token
        type: string
      last_login:
        description: Last login time
        example: "2021-07-01T12:00:00Z"
        type: string
      refresh_expires_in:
        description: Refresh token expiration time
        example: "2021-07-01T12:00:00Z"
        type: string
      refresh_token:
        description: Refresh token
        example: your_refresh_token
        type: string
      role:
        description: User role
        example: user
        type: string
      token_type:
        description: Token type
        example: Bearer
        type: string
    type: object
  PZNBatchResult:
    properties:
      id:
        description: ID of the query
        example: "1"
        type: string
      interactions:
        description: Drug-drug interactions
        items:
          $ref: '#/definitions/PZNInteraction'
        type: array
      message:
        description: Status message (e.g. error message)
        example: Success
        type: string
      status:
        description: HTTP status code of the query
        example: 200
        type: integer
    type: object
  PZNInteraction:
    properties:
      credibility:
        description: Credibility of the interaction
        example: insufficient
        type: string
      direction:
        description: Direction of the interaction
        example: undirected interaction
        type: string
      frequency:
        description: Frequency of the interaction
        example: common
        type: string
      plausibility:
        description: Plausibility of the interaction
        example: plausible mechanism
        type: string
      pzn_left:
        description: Victim PZN
        example:
        - "1234567"
        items:
          type: string
        type: array
      pzn_right:
        description: Perpetrator PZN
        example:
        - "7654321"
        items:
          type: string
        type: array
      relevance:
        description: Relevance of the interaction
        example: minor
        type: string
      text:
        allOf:
        - $ref: '#/definitions/InteractionText'
        description: Extracted interaction text
    type: object
  PZNInteractionPostQuery:
    properties:
      details:
        description: Detailed interaction descriptions
        example: true
        type: boolean
      id:
        description: ID of the query
        example: "1"
        type: string
      pzns:
        description: Array of PZNs
        example:
        - "1234567"
        - "7654321"
        items:
          type: string
        type: array
      text:
        description: Fetch interaction text
        example: true
        type: boolean
    required:
    - id
    - pzns
    type: object
  PingResp:
    properties:
      message:
        description: Message
        example: pong
        type: string
    type: object
  RefreshQuery:
    properties:
      refresh_token:
        example: my_refresh_token
        type: string
    required:
    - refresh_token
    type: object
  ResetConfirmPwdQuery:
    properties:
      email:
        description: Email address
        example: joe@me.com
        type: string
      password:
        description: New password
        example: my_new_pwd
        type: string
      token:
        description: Reset token
        example: my_reset_token
        type: string
    required:
    - email
    - password
    - token
    type: object
  ResetPwdQuery:
    properties:
      email:
        description: Email address
        example: joe@me.com
        type: string
    required:
    - email
    type: object
  UpdateProfileQuery:
    properties:
      first_name:
        description: First name
        example: Joe
        maxLength: 255
        minLength: 2
        type: string
      last_name:
        description: Last name
        example: Doe
        maxLength: 255
        minLength: 2
        type: string
      organization:
        description: Organization
        example: ACME
        maxLength: 255
        minLength: 2
        type: string
    type: object
  UserProfile:
    properties:
      email:
        description: Email address
        example: joe@me.com
        type: string
      first_name:
        description: First name
        example: Joe
        type: string
      last_login:
        description: Last login time
        example: "2021-07-01T12:00:00Z"
        type: string
      last_name:
        description: Last name
        example: Doe
        type: string
      organization:
        description: Organization
        example: ACME
        type: string
      role:
        description: User role
        example: user
        type: string
    type: object
  ValidationError:
    properties:
      field:
        description: Field Query or JSON field
        example: query_field
        type: string
      reason:
        description: Validation error reason
        example: reason
        type: string
    type: object
  ValidationResponse:
    properties:
      errors:
        description: Validation errors
        items:
          $ref: '#/definitions/ValidationError'
        type: array
    type: object
  adrcontroller.ADR:
    properties:
      description:
        type: string
      frequency:
        type: string
      frequency_code:
        type: integer
    type: object
  adrcontroller.PznADR:
    properties:
      adrs:
        items:
          $ref: '#/definitions/adrcontroller.ADR'
        type: array
      pzn:
        type: string
    type: object
  cfg.LimitsConfig:
    description: Configuration limits for the API
    properties:
      max_batch_queries:
        description: Max number of baches for POST requests
        example: 50
        type: integer
      max_drugs:
        description: Max number of drugs for interaction check
        example: 100
        type: integer
    type: object
  cfg.MetaConfig:
    description: Meta Information for the API
    properties:
      api:
        example: API Name
        type: string
      description:
        example: API Description
        type: string
      url:
        example: https://api.example.com
        type: string
      version:
        example: 1.0.0
        type: string
      version_tag:
        example: sometag
        type: string
    type: object
  map_string_string:
    additionalProperties:
      type: string
    type: object
  priscuscontroller.PriscusCompoundResult:
    properties:
      input:
        type: string
      priscus:
        type: boolean
    type: object
  priscuscontroller.PriscusResponse:
    properties:
      PZN:
        type: string
      priscus:
        type: boolean
    type: object
  pzncontroller.Compound:
    properties:
      compound:
        items:
          $ref: '#/definitions/pzncontroller.CompoundName'
        type: array
    type: object
  pzncontroller.CompoundName:
    properties:
      derivate:
        type: boolean
      name:
        type: string
      preferred:
        type: boolean
      pzn:
        type: string
      standards:
        items:
          type: string
        type: array
    type: object
  pzncontroller.ProductInfo:
    properties:
      category:
        type: string
      is_combination:
        type: boolean
      product_name:
        type: string
      pzn:
        type: string
    type: object
  pzncontroller.ProductInfos:
    properties:
      product_info:
        items:
          $ref: '#/definitions/pzncontroller.ProductInfo'
        type: array
    type: object
  qtcontroller.QTCompoundResult:
    properties:
      input:
        type: string
      qt_category:
        type: string
    type: object
  qtcontroller.QTResponse:
    properties:
      pzn:
        type: string
      qt_category:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin/users:
    get:
      description: |-
        __Admin role required__
        List all users for the API.
      produces:
      - application/json
      responses:
        "200":
          description: User created
          schema:
            $ref: '#/definitions/JSendSuccess-map_string_string'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "403":
          description: Non-admin user
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: Get all users
      tags:
      - Admin
    post:
      description: |-
        __Admin role required__
        Create a new user for the API. Ths user will receive an email with a token to set their password.
        You can create users with the following roles: `admin`, `user`, `approver`.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateUserQuery'
      produces:
      - application/json
      responses:
        "200":
          description: User created
          schema:
            $ref: '#/definitions/JSendSuccess-map_string_string'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "403":
          description: Non-admin user
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "422":
          description: Bad query format
          schema:
            $ref: '#/definitions/JSendFailure-ValidationResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: Create a new user
      tags:
      - Admin
  /admin/users/service:
    post:
      description: |-
        __Admin role required__
        Create a new service user for the API.
        You can create users with the following roles: `admin`, `user`, `approver`.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateServiceUserQuery'
      produces:
      - application/json
      responses:
        "200":
          description: User created
          schema:
            $ref: '#/definitions/JSendSuccess-map_string_string'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "403":
          description: Non-admin user
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "422":
          description: Bad query format
          schema:
            $ref: '#/definitions/JSendFailure-ValidationResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: Create a new service user
      tags:
      - Admin
  /adrs/pzns:
    get:
      description: |-
        Get ADRs for one or more PZNs. Each PZN can have multiple ADRs.
        The `lang` parameter can be used to specify the language of the ADR descriptions.
        Valid values are `english`, `german`, and `german-simple`.
        The default language is `english`.
        `german-simple` returns the simplified German ADR description.
      parameters:
      - description: Comma-separated list of PZNs
        in: query
        name: pzns
        required: true
        type: string
      - description: 'Language for ADR names (default: english)'
        enum:
        - english
        - german
        - german-simple
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of PZNs with ADRs
          schema:
            items:
              $ref: '#/definitions/adrcontroller.PznADR'
            type: array
        "400":
          description: Bad request (e.g. invalid PZNs)
        "404":
          description: PZN(s) not found
      summary: List ADRs for PZNs
      tags:
      - Adverse Drug Reactions
  /compounds/guidelines:
    get:
      consumes:
      - application/json
      description: Retrieves guidelines by drug name and includes all related synonyms
        for the drug.
      parameters:
      - description: Comma-separated compound names (e.g., Metoprolol,Aspirin)
        in: query
        name: names
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response
          schema:
            items:
              type: object
            type: array
        "400":
          description: Invalid request format or too many names provided
        "500":
          description: Internal server error
      summary: Get guidelines by drug name
      tags:
      - pharmgkb
  /compounds/names:
    get:
      consumes:
      - application/json
      description: Retrieves compounds by name and includes all related compounds
        sharing the same identifier.
      parameters:
      - description: Comma-separated compound names (e.g., Metoprolol,Aspirin)
        in: query
        name: names
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response
          schema:
            items:
              type: object
            type: array
        "400":
          description: Invalid request format or too many names provided
        "500":
          description: Internal server error
      summary: Get compounds by name
      tags:
      - compounds
  /formulations:
    get:
      description: |-
        Drug formulation codes and their descriptions that are used in the database.
        These codes are used, e.g., in the compound interaction endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: Response with formulations
          schema:
            $ref: '#/definitions/JSendSuccess-FormResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: List all drug formulation codes and their descriptions
      tags:
      - Formulation
  /interactions/compounds:
    get:
      description: |-
        The result will be an array of drug-drug interactions between the provided compounds.
        Each interaction will contain the plausibility, relevance, frequency, credibility,
        and direction of the interaction.
        The direction of the interaction describes the relationship between the victims (left)
        and the perpetrators (right).
        The left side and right side of the interaction can include more than one compound if the same interaction
        is observed between multiple compounds. This can be the case if the same compound is marketed
        under different names or derivatives are considered.
        If the `details` query parameter is set to `true`, the interaction descriptions will be more detailed.
        If the `doses` query parameter is set to `true`, the interaction will contain the relevant
        doses/formulations of the compounds that are involved in the interaction.
      parameters:
      - description: Comma separated string of compounds
        in: query
        name: compounds
        required: true
        type: string
      - description: Fetch doses
        in: query
        name: doses
        type: boolean
      - description: Fetch detailed interaction descriptions
        in: query
        name: details
        type: boolean
      - description: Fetch interaction text
        in: query
        name: text
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of drug-drug interactions
          schema:
            $ref: '#/definitions/JSendSuccess-array_CompoundInteraction'
        "400":
          description: Invalid compound names
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "404":
          description: Compound(s) not found
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "422":
          description: Bad query format
          schema:
            $ref: '#/definitions/JSendFailure-ValidationResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: Query drug-drug interactions between compounds
      tags:
      - Drug-Drug Interactions
    post:
      description: |-
        This is the batch version of the `GET /interactions/compounds` endpoint.
        The result will be an array of drug-drug interactions between the provided compounds.
        Each interaction will contain the plausibility, relevance, frequency, credibility,
        and direction of the interaction.
        The direction of the interaction describes the relationship between the victims (left)
        and the perpetrators (right).
        The left side and right side of the interaction can include multiple compounds if the same interaction
        is observed between multiple compounds. This may happen if the same compound is marketed under different names.
        If the `details` query parameter is set to `true`, the interaction descriptions will be more detailed.
        If the `doses` query parameter is set to `true`, the relevant doses/formulations of the compounds involved will be included.
        Ids for the queries must be unique.
        Queries will be processed in parallel.
        **Some/all queries may fail, resulting in error code `207`.**
        The response will contain results for all queries, even if some failed.
        **The user must check the status of each query in the batch.**
      parameters:
      - description: Batch query for drug-drug interactions
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/CompoundInteractionPostQuery'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Results with no errors
          schema:
            $ref: '#/definitions/JSendSuccess-array_CompoundBatchResult'
        "207":
          description: Results with errors
          schema:
            $ref: '#/definitions/JSendSuccess-array_CompoundBatchResult'
        "400":
          description: Too many IDs or duplicate IDs
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/JSendFailure-ErrorResponse'
        "422":
          description: Bad query format
          schema:
            $ref: '#/definitions/JSendFailure-ValidationResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/JSendError'
      security:
      - Bearer: []
      summary: Query drug-drug interactions between compounds in batch
      tags:
      - Drug-Drug Interactions
