name: Docker Image CI for GHCR

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # podman is pre-installed on GitHub-hosted ubuntu-latest runners.
      - name: Log in to GHCR
        run: echo "${{ secrets.GH_PACKAGE_PAT }}" | podman login ghcr.io -u "${{ secrets.GH_LOGIN }}" --password-stdin

      - name: Build and push the image
        run: |
          podman build --no-cache -t ghcr.io/clinical-pharmacy-saarland-university/abdataapi-go:latest .
          podman push ghcr.io/clinical-pharmacy-saarland-university/abdataapi-go:latest
